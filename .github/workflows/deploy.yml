name: Deploy Production

on:
  push:
    branches:
      - main
    # 只改文件或截圖的 commit 不用重新部署。要手動部署請用 workflow_dispatch。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Production preflight
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy backend and frontend
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load production deploy target
        id: deploy-target
        shell: bash
        run: |
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            echo "$line" >> "$GITHUB_ENV"
            echo "$line" >> "$GITHUB_OUTPUT"
          done < deployment/production.env

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 順序：規則＋索引 → 後端（先不導流量）→ 檢查 → 導流量 → 前端。
      # 注意：索引這步只是先送出建立請求，大型集合可能還在建，不等它建完。
      - name: Deploy Firestore rules and indexes
        run: npx --yes firebase-tools@15.1.0 deploy --only firestore:rules,firestore:indexes --project "${{ env.FIREBASE_PROJECT_ID }}"

      - name: Deploy backend to Cloud Run (candidate, no traffic yet)
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ steps.deploy-target.outputs.GCP_PROJECT_ID }}
          service: ${{ steps.deploy-target.outputs.CLOUD_RUN_SERVICE }}
          region: ${{ steps.deploy-target.outputs.GCP_REGION }}
          source: backend
          no_traffic: true
          tag: next
          env_vars: |
            NODE_ENV=production
            LLM_PROVIDER=${{ steps.deploy-target.outputs.LLM_PROVIDER }}
            LLM_MODEL=${{ steps.deploy-target.outputs.LLM_MODEL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            LIFF_CHANNEL_ID=${{ steps.deploy-target.outputs.LIFF_CHANNEL_ID }}
            CLOUD_RUN_SERVICE_URL=${{ steps.deploy-target.outputs.CLOUD_RUN_URL }}
            HUB_PUBLIC_BASE_URL=${{ steps.deploy-target.outputs.HUB_PUBLIC_BASE_URL }}
            HUB_MEDIA_BUCKET=${{ steps.deploy-target.outputs.HUB_MEDIA_BUCKET }}
            HUB_TASKS_QUEUE=${{ steps.deploy-target.outputs.HUB_TASKS_QUEUE }}
            HUB_TASKS_LOCATION=${{ steps.deploy-target.outputs.HUB_TASKS_LOCATION }}
            HUB_ENCRYPTION_KEY=${{ secrets.HUB_ENCRYPTION_KEY }}
            SCHEDULER_SECRET=${{ secrets.SCHEDULER_SECRET }}

      # 一定要打 tag 網址（next---<原 host>），打正式網址只會測到舊版。
      # 失敗時 job 會停在這裡，新版沒拿到流量，線上維持上一版。
      - name: Check candidate revision
        shell: bash
        run: |
          set -euo pipefail
          base="${CLOUD_RUN_URL#https://}"
          candidate="https://next---${base}"
          echo "Checking ${candidate}/health"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "${candidate}/health"
          echo
          # 沒帶憑證必須是 401；404/5xx 代表新版路由或啟動有問題
          code="$(curl --silent --output /dev/null --retry 3 --retry-all-errors --max-time 20 --write-out '%{http_code}' "${candidate}/api/hub/me")"
          echo "/api/hub/me without credentials -> ${code}"
          test "${code}" = "401"

      - name: Route traffic to the new revision
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ steps.deploy-target.outputs.GCP_PROJECT_ID }}
          service: ${{ steps.deploy-target.outputs.CLOUD_RUN_SERVICE }}
          region: ${{ steps.deploy-target.outputs.GCP_REGION }}
          revision_traffic: LATEST=100

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ steps.deploy-target.outputs.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ steps.deploy-target.outputs.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ steps.deploy-target.outputs.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ steps.deploy-target.outputs.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ steps.deploy-target.outputs.VITE_FIREBASE_APP_ID }}
          VITE_LIFF_ID: ${{ steps.deploy-target.outputs.VITE_LIFF_ID }}
          VITE_API_BASE_URL: ${{ steps.deploy-target.outputs.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@15.1.0 deploy --only hosting --project "${{ env.FIREBASE_PROJECT_ID }}"
